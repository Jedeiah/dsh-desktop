name: TestParse3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14 # arm64（产物为 aarch64 DMG）
    env:
      DSH_VERSION: 0.1.0-rc.6 # 内置 dsh 闭包版本（上游 dsh 更新时改这里）
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version & tag
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APP_VERSION="${{ inputs.version }}"
          else
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync tauri.conf.json version to ${{ steps.ver.outputs.app_version }}
        run: |
          cd apps/desktop/src-tauri
          python3 - "${{ steps.ver.outputs.app_version }}" <<'PY'
import json, sys
p = "tauri.conf.json"
d = json.load(open(p))
d["version"] = sys.argv[1]
json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
print("version ->", sys.argv[1])
PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare bundled resources (node + dsh closure + icons)
        run: |
          NODE_SRC="$(command -v node)"
          npm install --prefix "$RUNNER_TEMP/closure" "@deepseek-ai/dsh@${DSH_VERSION}" \
            --ignore-scripts --no-audit --no-fund
          CLOSURE_SRC="$RUNNER_TEMP/closure/node_modules" \
          NODE_SRC="$NODE_SRC" \
          DSH_VERSION="$DSH_VERSION" \
          ./scripts/prepare-resources.sh

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build .app + DMG
        run: |
          cd apps/desktop/src-tauri
          cargo tauri build

      - name: Zip the .app (方便直接下载解压使用)
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "DeepSeek Harness.app" \
            "DeepSeek-Harness-macOS-arm64.zip"

      - name: Upload to GitHub Release (${{ steps.ver.outputs.tag }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/DeepSeek-Harness-macOS-arm64.zip
          generate_release_notes: true
