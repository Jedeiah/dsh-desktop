name: CI

# 每次 push / PR 做一次构建检查，确保代码可编译（不打包，快）
on:
  push:
    branches: [main, windows-support]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: macos-cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Cargo clippy (dev, warn)
        run: cd apps/desktop/src-tauri && cargo clippy --all-targets -- -D warnings
      - name: Cargo check (dev)
        run: cd apps/desktop/src-tauri && cargo check
      - name: Cargo test
        run: cd apps/desktop/src-tauri && cargo test

  build-windows:
    # Windows 目标上的真实编译检查（验证全部 #[cfg(windows)] 代码路径与
    # arboard/trash 依赖；macOS 本机无法交叉编译，故由 CI 把关）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: windows-cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
      - name: Cargo clippy (dev, warn)
        run: cd apps/desktop/src-tauri && cargo clippy --all-targets -- -D warnings
      - name: Cargo check (dev)
        run: cd apps/desktop/src-tauri && cargo check
      - name: Cargo test
        run: cd apps/desktop/src-tauri && cargo test

  scripts-syntax:
    name: 安装/工具脚本语法
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 这些脚本从不参与构建，语法错误只会在用户机器上炸——这里做最低成本的解析检查
      - name: bash -n（install.sh / prepare-resources.sh / bump-version.sh）
        run: for f in scripts/*.sh; do echo "checking $f"; bash -n "$f"; done
      - name: PowerShell 解析（install.ps1 / prepare-resources.ps1）
        shell: pwsh
        run: |
          foreach ($f in 'scripts/install.ps1','scripts/prepare-resources.ps1') {
            Write-Host "checking $f"
            $null = [ScriptBlock]::Create((Get-Content -Raw $f))
          }
      # 壳页 JS 不参与构建（只是被打进二进制的静态资源），语法错误一路到用户机器才会暴露：
      # 整个界面白屏。这里用 node 做一次解析检查（不做风格/lint）。
      - name: node --check（壳页 UI JS）
        run: for f in apps/desktop/ui/*.js; do echo "checking $f"; node --check "$f"; done
      # NSIS 钩子（installer-hooks.nsh）只在 Windows 打包时装进 tauri-bundler 的模板参与编译，
      # 语法错误会拖到发版时 Windows job 打包失败才暴露。这里用 apt 的 makensis 把它放进
      # 最小等价上下文（同样的 include 顺序 + 同样的宏 + 同样的插入点）编译一次；
      # 产物落在临时目录，不污染工作区。
      - name: NSIS 钩子编译检查（makensis）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          tmp=$(mktemp -d)
          cp apps/desktop/src-tauri/nsis-hooks-check.nsi apps/desktop/src-tauri/installer-hooks.nsh "$tmp"/
          # 与真实打包一致：tauri-bundler 调 makensis 时也带这两个字符集参数
          (cd "$tmp" && makensis -V2 -INPUTCHARSET UTF8 -OUTPUTCHARSET UTF8 nsis-hooks-check.nsi)
