name: Release

# 发版两种方式：
#   A) 推送 v* 标签（如 v0.1.1）→ tag 即版本，自动构建发布（推荐）
#   B) 网页手动触发 → 填版本号（如 0.1.1），自动打 v0.1.1 并发布
# App 版本会统一为输入的版本号（写入 tauri.conf.json，安装包名随之）
# 两个 job 并行构建：macOS（.app + DMG）与 Windows（NSIS + 便携 zip），
# 产物上传到同一个 GitHub Release。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.1.1，将作为 v0.1.1 发布）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14 # arm64（产物为 aarch64 DMG）
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version & tag
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APP_VERSION="${{ inputs.version }}"
          else
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Sync version to ${{ steps.ver.outputs.app_version }}
        run: |
          cd apps/desktop/src-tauri
          python3 - "${{ steps.ver.outputs.app_version }}" <<'PY'
          import json, re, sys, pathlib
          v = sys.argv[1]
          p = "tauri.conf.json"
          d = json.load(open(p))
          d["version"] = v
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          # Cargo.toml 的 version 必须同步，否则 env!("CARGO_PKG_VERSION") 仍是旧版
          # → 检查更新永远误报「发现新版本」(latest > 旧 CARGO_PKG_VERSION)。
          c = open("Cargo.toml").read()
          c = re.sub(r'^version = ".*"$', f'version = "{v}"', c, count=1, flags=re.M)
          open("Cargo.toml", "w").write(c)
          # cache-busting：ui 资源引用（theme.css/shell.js/modal.js 的 ?v=）同步为
          # 当前版本——防止 Windows WebView2 缓存旧 css/js（0.3.2 实测：HTML 更新了
          # 但 theme.css 命中旧缓存，V8 select 样式不生效）。
          for f in ["../ui/shell.html", "../ui/modal.html"]:
              fp = pathlib.Path(f)
              s = fp.read_text()
              s2 = re.sub(r"\?v=[0-9.]+", f"?v={v}", s)
              if s2 != s:
                  fp.write_text(s2)
                  print("cache-bust ->", f, v)
          print("version ->", v)
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Prepare bundled resources (node + npm + pnpm)
        run: |
          NODE_SRC="$(command -v node)" ./scripts/prepare-resources.sh

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build .app + DMG
        run: |
          cd apps/desktop/src-tauri
          cargo tauri build

      - name: Zip the .app (方便直接下载解压使用)
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/macos
          ditto -c -k --keepParent "DeepSeek Harness Desktop.app" \
            "DeepSeek-Harness-Desktop-macOS-arm64.zip"

      - name: Generate SHA-256 checksums
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          for f in dmg/*.dmg macos/DeepSeek-Harness-Desktop-macOS-arm64.zip; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -1 dmg/*.sha256 macos/*.sha256

      - name: Upload to GitHub Release (${{ steps.ver.outputs.tag }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          body: |
            ## 安装 / 升级（自动追最新版）

            macOS：
            ```bash
            curl -sSL https://raw.githubusercontent.com/Jedeiah/dsh-desktop/main/scripts/install.sh | bash
            ```

            Windows（PowerShell）：
            ```powershell
            powershell -ExecutionPolicy Bypass -Command "irm https://raw.githubusercontent.com/Jedeiah/dsh-desktop/main/scripts/install.ps1 | iex"
            ```

            或手动安装：macOS 下载 DMG → 拖入「应用程序」→ 首次右键 → 打开
            （若提示「已损坏」：`xattr -dr com.apple.quarantine "/Applications/DeepSeek Harness Desktop.app"`）；
            Windows 下载 `*-setup.exe` 双击安装（或解压便携 zip 直接运行）。

            ## 本次更新
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg.sha256
            apps/desktop/src-tauri/target/release/bundle/macos/DeepSeek-Harness-Desktop-macOS-arm64.zip
            apps/desktop/src-tauri/target/release/bundle/macos/DeepSeek-Harness-Desktop-macOS-arm64.zip.sha256
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest # x64（产物为 NSIS 安装器 + 便携 zip）
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version & tag
        id: ver
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            APP_VERSION="${{ inputs.version }}"
          else
            APP_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync version to ${{ steps.ver.outputs.app_version }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.app_version }}"
          node -e "const fs=require('fs');const p='apps/desktop/src-tauri/tauri.conf.json';const d=JSON.parse(fs.readFileSync(p));d.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n')" $v
          # Cargo.toml 的 version 必须同步（env!('CARGO_PKG_VERSION') 用于检查更新比较，
          # 不同步会导致发版产物永远误报「发现新版本」）
          $cp = "apps/desktop/src-tauri/Cargo.toml"
          (Get-Content $cp) -replace '^version = ".*"$', "version = `"$v`"" | Set-Content $cp

      - name: Prepare bundled resources (node.exe + npm + pnpm)
        shell: pwsh
        run: ./scripts/prepare-resources.ps1 -NodeSrc (Get-Command node).Source

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build NSIS installer
        shell: pwsh
        run: |
          cd apps/desktop/src-tauri
          cargo tauri build --bundles nsis

      - name: Zip portable build (exe + resources, 解压即用)
        shell: pwsh
        run: |
          $rel = "apps/desktop/src-tauri/target/release"
          $tmp = Join-Path $env:RUNNER_TEMP "portable"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "$rel/dsh-desktop.exe" $tmp
          Copy-Item -Recurse "$rel/resources" $tmp
          Compress-Archive -Path "$tmp/*" -DestinationPath "DeepSeek-Harness-Desktop-Windows-x64.zip" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe", "DeepSeek-Harness-Desktop-Windows-x64.zip" |
            ForEach-Object {
              $h = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
              # "<hex>  <filename>"（与 App 端解析格式一致）
              "$h  $($_.Name)" | Out-File -Encoding utf8 "$($_.FullName).sha256"
            }
          Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256", "*.sha256"

      - name: Upload to GitHub Release (${{ steps.ver.outputs.tag }})
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
            DeepSeek-Harness-Desktop-Windows-x64.zip
            DeepSeek-Harness-Desktop-Windows-x64.zip.sha256
          generate_release_notes: false
