[package]
name = "dsh-desktop"
version = "0.3.0"
description = "DeepSeek Harness Desktop — 跨平台桌面端（macOS / Windows），内置 node + dsh 闭包"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
dirs = "6"

[target.'cfg(unix)'.dependencies]
# 仅 unix 用 PID+SIGTERM 结束 dsh 子进程（dsh.rs 与 capture_user_env）
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows 专属：回收站（卸载时移入回收站）。
trash = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
