[package]
name = "dsh-desktop"
version = "0.5.0"
description = "DeepSeek Harness Desktop — 跨平台桌面端（macOS / Windows），内置 node + dsh 闭包"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
dirs = "6"
sha2 = "0.10"
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
# 仅 unix 用 PID+SIGTERM 结束 dsh 子进程（dsh.rs 与 capture_user_env）
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 原生窗口隐藏/唤醒（orderOut: / makeKeyAndOrderFront:）。实证：Tauri 2.11.5
# 的 WebviewWindow::hide() 调用后窗口仍在屏幕上；AppHandle::hide() 能隐藏但会清空
# 窗口注册表（召回时误判「窗口不存在」→ 重建壳页 → 丢工作台）。故直接走 AppKit。
objc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows 专属：回收站（卸载时移入回收站）。
trash = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1

# objc 的 msg_send!/class! 宏内部使用 `cfg(cargo-clippy)`，在较新的 rustc 上会触发
# unexpected_cfgs（CI 用 `clippy --all-targets -- -D warnings` 把关，警告即失败）。
# 把该 cfg 声明为已知值，同时不影响其它未知 cfg 的检查。
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
