[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — 跨平台桌面端（macOS / Windows），内置 node + dsh 闭包"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
ureq = "2"
dirs = "6"
# 跨平台 CSPRNG（替换 macOS 专属的 /dev/urandom；getrandom 已是本依赖树成员，无新增下载）
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
# 仅 unix 用 PID+SIGTERM 结束 LAN 代理（Windows 走 taskkill）
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Windows 专属：剪贴板（替代 pbcopy）与回收站（替代 Finder osascript）。
# 仅在 Windows 目标上编译，macOS/Linux 构建不会下载。
arboard = "3"
trash = "5"

[profile.release]
strip = true
lto = true
codegen-units = 1
