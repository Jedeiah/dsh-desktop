[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DeepSeek Harness Desktop — macOS 桌面端，内置 node + dsh 闭包"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
ureq = "2"
dirs = "6"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
