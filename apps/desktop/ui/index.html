<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* 启动页：安静承接（光斑克制、无旋转彩圈），dsh 就绪后立即被导航走 */
      .center { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 26px; }

      .icon-wrap { position: relative; }
      .icon {
        width: 84px; height: 84px;
        border-radius: 22px;
        display: block;
        box-shadow: 0 6px 30px rgba(0, 0, 0, 0.5), 0 0 30px var(--accent-glow);
      }

      .pill {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 22px;
        border-radius: 9999px;
        background: rgba(24, 27, 36, 0.5);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        font-size: 14px;
        line-height: 1;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.10);
        border: 1px solid var(--card-border);
      }
      .dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        background: var(--accent-2);
        box-shadow: 0 0 10px var(--accent-glow);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.06); }
      }

      .progress {
        width: 180px; height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .progress::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        animation: load 1.8s ease-in-out infinite;
      }
      @keyframes load {
        0%   { transform: translateX(-110%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="center">
      <div class="icon-wrap">
        <img class="icon" src="icon.png" alt="DeepSeek Harness" />
      </div>
      <div class="pill" role="status" aria-live="polite">
        <span class="dot"></span>
        正在启动 DeepSeek Harness…
      </div>
      <div class="hint">启动 dsh web 后自动进入工作台</div>
      <div class="progress" aria-hidden="true"></div>
    </div>
  </body>
</html>
