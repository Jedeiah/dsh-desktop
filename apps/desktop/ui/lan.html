<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>扫码远程连接</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* 弹窗内嵌（无系统标题栏）的 ✕ 关闭按钮 */
      .close-x {
        position: absolute;
        top: 12px; right: 14px;
        width: 26px; height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-faint);
        font-size: 15px;
        cursor: pointer;
        padding: 0;
        box-shadow: none;
      }
      .close-x:hover { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }

      .card { max-width: 440px; max-height: calc(100vh - 32px); overflow-y: auto; padding-top: 30px; }
      .sub { margin-top: -6px; }

      .qr-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 14px;
        border-radius: var(--r-md);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.10);
      }
      .qr-box img { display: block; border-radius: 6px; background: #fff; }
      .qr-box .qr-hint { font-size: 11px; color: var(--text-faint); text-align: center; line-height: 1.5; }

      .info-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .info-row .label { color: var(--text-dim); flex: none; }
      .info-row .val {
        flex: 1; min-width: 0;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: var(--r-sm);
        padding: 6px 10px;
        font-family: var(--font-mono);
        font-size: 11px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        user-select: all;
      }

      .actions { display: flex; gap: 8px; }
      .actions button { flex: 1; font-size: 12px; }
      #toggle { width: 100%; padding: 10px; font-size: 14px; }
      #toggle.off {
        background: linear-gradient(180deg, rgba(63,185,80,0.18), rgba(79,124,247,0.10));
      }

      /* 状态行：lan.js 使用 status-line on/off/err（接入共享 token） */
      .status-line { font-size: 12px; line-height: 1.5; min-height: 16px; }
      .status-line.on { color: var(--ok); }
      .status-line.off { color: var(--text-dim); }
      .status-line.err { color: var(--err); }
    </style>
  </head>
  <body>
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="card">
      <button class="close-x" id="closeBtn" aria-label="关闭" title="关闭">✕</button>
      <h1 class="anim" data-tauri-drag-region>扫码远程连接</h1>
      <div class="sub anim anim--d1">手机连同一 Wi-Fi，扫码或打开链接即可在手机上使用工作台（执行仍在电脑上）</div>
      <div class="status anim anim--d1" id="status"></div>
      <div class="qr-box anim anim--d1" id="qrBox" hidden>
        <div id="qr" data-url=""></div>
        <div class="qr-hint">手机相机扫码（iOS 需点横幅在 Safari 打开），无需输入令牌</div>
      </div>
      <div class="info-row anim anim--d2" id="addrRow" hidden>
        <span class="label">地址</span>
        <span class="val" id="addr"></span>
      </div>
      <div class="info-row anim anim--d2" id="tokenRow" hidden>
        <span class="label">令牌</span>
        <span class="val" id="token"></span>
      </div>
      <div class="actions anim anim--d2">
        <button id="copyAddr" hidden>复制地址</button>
        <button id="copyToken" hidden>复制令牌</button>
      </div>
      <button id="toggle" class="anim anim--d2"></button>
      <div class="hint anim anim--d2">重启工作台或重开本开关后，旧二维码与已连接手机将失效，需重新扫码。</div>
    </div>
    <script src="qrcode.js"></script>
    <script src="lan.js"></script>
  </body>
</html>
