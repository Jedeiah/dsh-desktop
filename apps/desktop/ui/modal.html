<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="theme.css?v=0.5.0" />
    <style>
      /* 透明窗口：覆盖 theme.css 的 body 实色背景（否则圆角卡片外露出方框）；
         卡片本身自带渐变背景，body 透明不影响显示 */
      html, body { background: transparent; }
      /* 卡片在窗口内居中。注意 theme.css 的 body 规则是给壳页的（v4 起不再带
         flex 居中），弹窗页必须自己声明，否则卡片贴左上角、圆角外露一大片窗口。 */
      body { display: flex; align-items: center; justify-content: center; }
      /* 卡片不超出窗口：弹窗窗口固定 460×300 且不可缩放。内容超高时由消息区滚动，
         保证底部按钮永远可见/可点（此前长文案会把「确定」推出窗口外，只能靠 ✕ 关）。 */
      .card { max-height: 100%; }
      .head, .foot { flex: none; }
      /* 卡片表面与壳页抽屉/命令面板同源（surface-1），顶部微高光贴合 macOS
         面板质感；不用 theme.css 的 .glow（透明窗口上 blur 光晕渲染发灰发脏，
         观感「不统一」，已移除） */
      .card {
        background: linear-gradient(180deg, var(--dsh-surface-2) 0%, var(--dsh-surface-1) 42px);
      }
      /* 弹窗内嵌：消息区占满卡片剩余高度并内部滚动（flex + min-height:0 才允许
         收缩到内容高度以下，长文案才滚得动） */
      .msg {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        font-size: 13px;
        line-height: 1.7;
        color: var(--text-dim);
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
      }
      .foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 2px; }
      /* 右上角 ✕ 关闭（无系统标题栏后的替代）。
         必须写 `.card button.close-x`：theme.css 有 `.card button{position:relative}`
         （特异性 0,1,1，高于单独的 `.close-x` = 0,1,0），否则 ✕ 会变成流内元素、
         把标题/正文整体下推，底部按钮被挤出窗口。 */
      .card button.close-x {
        position: absolute;
        top: 12px; right: 14px;
        width: 26px; height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-faint);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
        box-shadow: none;
      }
      .card button.close-x:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); box-shadow: none; }
      .card { padding-top: 30px; }
      .icon-badge.neutral {
        background: linear-gradient(180deg, rgba(79, 124, 247, 0.20), rgba(123, 127, 232, 0.10));
      }
    </style>
  </head>
  <body>
    <div class="card anim">
      <button class="close-x" id="closeX" aria-label="关闭" title="关闭">✕</button>
      <div class="head anim" id="head" data-tauri-drag-region>
        <div class="icon-badge neutral">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7b7fe8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v4l2.5 2.5"/>
          </svg>
        </div>
        <div class="head-text">
          <h1 id="title"></h1>
        </div>
      </div>
      <div class="msg anim anim--d1" id="message"></div>
      <div class="foot anim anim--d1">
        <button class="ghost" id="btnNo" hidden>稍后</button>
        <button id="btnOk">确定</button>
      </div>
    </div>

    <script src="modal.js?v=0.5.0"></script>
  </body>
</html>
