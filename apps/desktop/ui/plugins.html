<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>插件管理</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /* 弹窗内嵌（无系统标题栏）的 ✕ 关闭按钮 */
      .close-x {
        position: absolute;
        top: 12px; right: 14px;
        width: 26px; height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-faint);
        font-size: 15px;
        cursor: pointer;
        padding: 0;
        box-shadow: none;
      }
      .close-x:hover { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }

      .card { max-width: 480px; max-height: calc(100vh - 36px); padding-top: 30px; }
      .sub { margin-top: -6px; }
      code { background: rgba(255,255,255,0.08); border-radius: 4px; padding: 1px 5px; font-size: 11px; }

      .row { display: flex; gap: 8px; }

      #btnRemove {
        background: linear-gradient(180deg, rgba(248,81,73,0.18), rgba(248,81,73,0.08));
      }
      #btnRemove:hover {
        background: linear-gradient(180deg, rgba(248,81,73,0.30), rgba(248,81,73,0.14));
      }

      pre {
        background: var(--bg-soft);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: var(--r-md);
        padding: 10px 12px;
        font-size: 11px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-all;
        max-height: 220px;
        overflow-y: auto;
        color: #c9d1d9;
        font-family: var(--font-mono);
      }
      pre:empty { display: none; }
    </style>
  </head>
  <body>
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="card">
      <button class="close-x" id="closeBtn" aria-label="关闭" title="关闭">✕</button>
      <h1 class="anim" data-tauri-drag-region>插件管理</h1>
      <div class="sub anim anim--d1">安装 / 卸载 dsh 插件（安装到 <code>~/.dsh/profiles/web</code>，与终端共享）</div>
      <div class="row anim anim--d1">
        <input id="pkg" type="text" placeholder="包名，如 @linxin666/dsh-web-ui-all" autofocus spellcheck="false" />
        <button id="btnInstall">安装</button>
        <button id="btnRemove">卸载</button>
      </div>
      <div class="status anim anim--d2" id="status"></div>
      <pre id="output" class="anim anim--d2" hidden></pre>
      <div class="hint anim anim--d2">插件会运行其构建脚本；安装/卸载完成后请通过托盘菜单「重启工作台」生效。</div>
    </div>
    <script src="plugins.js"></script>
  </body>
</html>
