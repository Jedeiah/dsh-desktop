<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>卸载 DeepSeek Harness？</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: #05060a;
        color: #f0f2f7;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      /* 氛围光斑（红紫色警示感） */
      .glow {
        position: fixed;
        z-index: 0;
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        will-change: transform;
        animation: drift 26s ease-in-out infinite alternate;
      }
      .glow--a {
        width: 42vw; height: 42vw; left: -18vw; top: -16vh;
        background: radial-gradient(circle, rgba(248, 81, 73, 0.38) 0%, rgba(248, 81, 73, 0) 70%);
      }
      .glow--b {
        width: 46vw; height: 46vw; right: -20vw; bottom: -18vh;
        background: radial-gradient(circle, rgba(152, 58, 214, 0.4) 0%, rgba(152, 58, 214, 0) 70%);
        animation-duration: 30s;
        animation-delay: -9s;
      }
      @keyframes drift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to   { transform: translate3d(4vw, -3vh, 0) scale(1.1); }
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(420px, 94vw);
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 24px 26px 18px;
        border-radius: 22px;
        background: rgba(28, 27, 36, 0.5);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        box-shadow:
          0 0 40px rgba(248, 81, 73, 0.1),
          0 0 30px rgba(152, 58, 214, 0.12),
          inset 0 1px 1px rgba(255, 255, 255, 0.14),
          0 24px 70px rgba(0, 0, 0, 0.5);
      }
      .card::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1.5px;
        background: linear-gradient(180deg,
          rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.14) 40%,
          rgba(255,255,255,0.14) 60%, rgba(255,255,255,0.5) 100%);
        -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
                mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
                mask-composite: exclude;
        pointer-events: none;
      }

      /* 头部：图标 + 标题 + 说明 */
      .head { display: flex; align-items: center; gap: 14px; }
      .icon-badge {
        flex: none;
        width: 46px; height: 46px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(248, 81, 73, 0.2), rgba(152, 58, 214, 0.12));
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 22px rgba(248, 81, 73, 0.25), inset 0 1px 1px rgba(255,255,255,0.12);
      }
      .head-text h1 { font-size: 16px; font-weight: 600; }
      .head-text p {
        font-size: 12px;
        color: rgba(240, 242, 247, 0.55);
        line-height: 1.6;
        margin-top: 3px;
      }

      /* 选项卡片 */
      .options { display: flex; flex-direction: column; gap: 10px; }
      .opt {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        width: 100%;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        color: #f0f2f7;
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      }
      .opt:hover {
        background: rgba(255, 255, 255, 0.07);
        transform: translateY(-1px);
      }
      .opt:active { transform: scale(0.99); }
      .opt:disabled { opacity: 0.5; cursor: default; transform: none; }
      .opt-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .opt-desc { font-size: 11px; color: rgba(240, 242, 247, 0.5); }
      .opt.primary {
        border-color: rgba(201, 103, 232, 0.35);
        background: linear-gradient(180deg, rgba(201, 103, 232, 0.12), rgba(122, 90, 248, 0.08));
      }
      .opt.primary:hover {
        border-color: rgba(201, 103, 232, 0.6);
        box-shadow: 0 0 24px rgba(201, 103, 232, 0.25);
      }
      .opt.danger {
        border-color: rgba(248, 81, 73, 0.3);
        background: linear-gradient(180deg, rgba(248, 81, 73, 0.1), rgba(218, 54, 51, 0.06));
      }
      .opt.danger:hover {
        border-color: rgba(248, 81, 73, 0.55);
        box-shadow: 0 0 22px rgba(248, 81, 73, 0.25);
      }
      .dot {
        width: 7px; height: 7px; border-radius: 50%; flex: none;
      }
      .dot.keep { background: linear-gradient(135deg, #c967e8, #9864a0); }
      .dot.wipe { background: linear-gradient(135deg, #f85149, #f0883e); }

      .status { font-size: 12px; min-height: 15px; line-height: 1.5; }
      .status.err { color: #f85149; }
      .status.ok { color: #3fb950; }

      /* 底部：取消（弱化） */
      .foot { display: flex; justify-content: flex-end; }
      .cancel {
        border: none;
        background: transparent;
        color: rgba(240, 242, 247, 0.55);
        font-size: 12px;
        font-family: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: color 0.2s ease, background 0.2s ease;
      }
      .cancel:hover { color: #f0f2f7; background: rgba(255, 255, 255, 0.06); }
      .cancel:disabled { opacity: 0.5; cursor: default; }

      /* 执行中遮罩 */
      .busy-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        border-radius: inherit;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(5, 6, 10, 0.68);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .busy-overlay.show { display: flex; }
      .spinner {
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(201, 103, 232, 0.25);
        border-top-color: #c967e8;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .busy-overlay span { font-size: 13px; color: #f0f2f7; }

      .anim { opacity: 0; animation: fadeUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .anim--d1 { animation-delay: 0.05s; }
      .anim--d2 { animation-delay: 0.1s; }
      .anim--d3 { animation-delay: 0.16s; }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .glow, .spinner, .anim { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="card">
      <div class="head anim">
        <div class="icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </div>
        <div class="head-text">
          <h1>卸载 DeepSeek Harness？</h1>
          <p>将结束 dsh 子进程、删除应用数据与登录自启项，并把 App 移入废纸篓 / 回收站（可恢复）。</p>
        </div>
      </div>

      <div class="options anim anim--d1">
        <button id="keep" class="opt primary">
          <span class="opt-title"><span class="dot keep"></span>卸载（保留 ~/.dsh）</span>
          <span class="opt-desc">保留会话与凭据，方便日后重新使用</span>
        </button>
        <button id="wipe" class="opt danger">
          <span class="opt-title"><span class="dot wipe"></span>卸载并删除 ~/.dsh</span>
          <span class="opt-desc">连会话与凭据一起删除，不可恢复</span>
        </button>
      </div>

      <div class="status anim anim--d2" id="status"></div>

      <div class="foot anim anim--d3">
        <button id="cancel" class="cancel">取消</button>
      </div>

      <div class="busy-overlay" id="busyOverlay">
        <div class="spinner"></div>
        <span>正在卸载…</span>
      </div>
    </div>
    <script src="uninstall.js"></script>
  </body>
</html>
