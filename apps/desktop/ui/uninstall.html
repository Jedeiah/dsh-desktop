<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>卸载 DeepSeek Harness？</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      .card { max-width: 440px; }

      /* 选项卡片（与既有交互一致） */
      .options { display: flex; flex-direction: column; gap: 10px; }
      .opt {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 3px;
        width: 100%;
        padding: 12px 14px;
        border-radius: var(--r-md);
        border: 1px solid rgba(255, 255, 255, 0.10);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        font-family: inherit;
        text-align: left;
        cursor: pointer;
        transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      }
      .opt:hover { background: rgba(255, 255, 255, 0.07); transform: translateY(-1px); }
      .opt:active { transform: scale(0.99); }
      .opt:disabled { opacity: 0.5; cursor: default; transform: none; }
      .opt-title { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
      .opt-desc { font-size: 11px; color: var(--text-dim); }
      .opt.primary {
        border-color: rgba(123, 127, 232, 0.35);
        background: linear-gradient(180deg, rgba(79, 124, 247, 0.12), rgba(123, 127, 232, 0.06));
      }
      .opt.primary:hover {
        border-color: rgba(123, 127, 232, 0.6);
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .opt.danger {
        border-color: rgba(248, 81, 73, 0.3);
        background: linear-gradient(180deg, rgba(248, 81, 73, 0.10), rgba(248, 81, 73, 0.05));
      }
      .opt.danger:hover {
        border-color: rgba(248, 81, 73, 0.55);
        box-shadow: 0 0 18px rgba(248, 81, 73, 0.25);
      }
      .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      .dot.keep { background: linear-gradient(135deg, #7b7fe8, #4f7cf7); }
      .dot.wipe { background: linear-gradient(135deg, #f85149, #f0883e); }

      /* 底部：取消（弱化） */
      .foot { display: flex; justify-content: flex-end; }
      .cancel {
        border: none;
        background: transparent;
        color: var(--text-dim);
        font-size: 12px;
        font-family: inherit;
        padding: 6px 12px;
        border-radius: 8px;
        cursor: pointer;
        transition: color 0.2s ease, background 0.2s ease;
      }
      .cancel:hover { color: var(--text); background: rgba(255, 255, 255, 0.06); }
      .cancel:disabled { opacity: 0.5; cursor: default; }

      /* 执行中遮罩 */
      .busy-overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        border-radius: inherit;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(10, 12, 17, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }
      .busy-overlay.show { display: flex; }
      .spinner {
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(123, 127, 232, 0.25);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .busy-overlay span { font-size: 13px; color: var(--text); }

      /* 无系统标题栏：右上角 ✕ 关闭（等于取消，不触发卸载） */
      .close-x {
        position: absolute;
        top: 12px; right: 14px;
        width: 26px; height: 26px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--text-faint);
        font-size: 15px;
        cursor: pointer;
        padding: 0;
        box-shadow: none;
      }
      .close-x:hover { background: rgba(255,255,255,0.08); color: var(--text); box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="card">
      <button class="close-x" id="closeBtn" aria-label="关闭" title="取消">✕</button>
      <div class="head anim" data-tauri-drag-region>
        <div class="icon-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f85149" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
        </div>
        <div class="head-text">
          <h1>卸载 DeepSeek Harness？</h1>
          <p>将结束 dsh 子进程、删除应用数据与登录自启项。Windows 会唤起系统卸载器完成全部清理（可先卸载、后处理 ~/.dsh）。</p>
        </div>
      </div>

      <div class="options anim anim--d1">
        <button id="keep" class="opt primary">
          <span class="opt-title"><span class="dot keep"></span>卸载（保留 ~/.dsh）</span>
          <span class="opt-desc">保留会话与凭据，方便日后重新使用</span>
        </button>
        <button id="wipe" class="opt danger">
          <span class="opt-title"><span class="dot wipe"></span>卸载并删除 ~/.dsh</span>
          <span class="opt-desc">连会话与凭据一起删除，不可恢复</span>
        </button>
      </div>

      <div class="status anim anim--d2" id="status"></div>

      <div class="foot anim anim--d3">
        <button id="cancel" class="cancel">取消</button>
      </div>

      <div class="busy-overlay" id="busyOverlay">
        <div class="spinner"></div>
        <span>正在卸载…</span>
      </div>
    </div>
    <script src="uninstall.js"></script>
  </body>
</html>
